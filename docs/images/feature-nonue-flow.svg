<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Non-UE helper architecture</title><desc id="desc">Save coordination and menu previews share the plain C++ storage API. The plain C++ command registrar uses the console world to find its menu controller, checks startup flow, and dispatches the existing New Game action.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/>
<text x="60" y="64" font-size="20" font-weight="700" fill="#627e79" text-anchor="start">CRAZY BALLS / SYSTEM ARCHITECTURE</text>
<text x="60" y="117" font-size="44" font-weight="700" fill="#203e49" text-anchor="start">Non-UE helper architecture</text>
<text x="60" y="154" font-size="25" font-weight="400" fill="#34495a" text-anchor="start">Focused APIs · Shared storage · Command registration</text><rect x="60" y="195" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="82" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Save coordinator</text><text x="82" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UGameInstanceSubsystem</text><text x="82" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Requests session I/O.</text><text x="82" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Receives progress snapshots.</text><rect x="540" y="195" width="400" height="190" rx="24" fill="#e8eefb"/><text x="562" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Save storage helper</text><text x="562" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Creates UFeatureSaveGame</text><text x="562" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Owns slot and path details.</text><text x="562" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Serializes progress values.</text><rect x="60" y="460" width="400" height="190" rx="24" fill="#f0eafa"/><text x="82" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Saved-progress preview</text><text x="82" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UUserWidget</text><text x="82" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Reads the saved snapshot.</text><text x="82" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Formats the menu summary.</text><rect x="540" y="460" width="400" height="190" rx="24" fill="#f0eafa"/><text x="562" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Menu controller</text><text x="562" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UWorldSubsystem</text><text x="562" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Runs the New Game action.</text><text x="562" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Applies save-slot policy.</text><rect x="60" y="730" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Console commands</text><text x="82" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Plain C++ registrar</text><text x="82" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Exposes Feature.NewGame.</text><text x="82" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Non-Shipping registration.</text><rect x="540" y="730" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="562" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">World command context</text><text x="562" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Supplied by Unreal console</text><text x="562" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Finds that world’s menu.</text><text x="562" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Requires startup menu flow.</text><path d="M 460 290 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="477" y="241" width="46" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="264" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">I/O</text><path d="M 460 495 H 500 V 350 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="472" y="376" width="56" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="399" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">read</text><path d="M 460 825 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="467" y="775" width="66" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="798" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">uses</text><path d="M 740 730 V 650" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="692" y="671" width="96" height="30" rx="10" fill="#fbfaf6"/><text x="740" y="694" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">dispatch</text><text x="60" y="967" font-size="23" font-weight="600" fill="#34495a" text-anchor="start">Plain C++ helpers use Unreal APIs through focused entry points.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Non-UE helper architecture</title><desc id="desc">Three plain C++ helpers illustrate explicit ownership and narrow engine API boundaries. The session owns its pool by value; weak references observe world-owned actors. Storage centralizes slot/path knowledge and returns optional snapshot values. A HUD factory returns the widget retained by its caller. These helpers use Unreal APIs without UObject lifetime.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/>
<text x="60" y="64" font-size="20" font-weight="700" fill="#627e79" text-anchor="start">CRAZY BALLS / SYSTEM ARCHITECTURE</text>
<text x="60" y="117" font-size="44" font-weight="700" fill="#203e49" text-anchor="start">Non-UE helper architecture</text>
<text x="60" y="154" font-size="25" font-weight="400" fill="#34495a" text-anchor="start">Example: helpers · Ownership · Factories · Storage boundary</text><rect x="60" y="195" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="82" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Gameplay session</text><text x="82" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UWorldSubsystem</text><text x="82" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Owns the spawner by value.</text><text x="82" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Requests initial + new balls.</text><rect x="540" y="195" width="400" height="190" rx="24" fill="#e8eefb"/><text x="562" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Ball pool helper</text><text x="562" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Creates AFeatureBall</text><text x="562" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Reuses world-owned actors.</text><text x="562" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Tracks weak references.</text><path d="M 460 290 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="467" y="242" width="66" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="265" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">spawn</text><rect x="60" y="460" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="82" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Save coordinator</text><text x="82" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UGameInstanceSubsystem</text><text x="82" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Calls a focused storage API.</text><text x="82" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Consumes snapshot results.</text><rect x="540" y="460" width="400" height="190" rx="24" fill="#e8eefb"/><text x="562" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Save storage helper</text><text x="562" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Creates UFeatureSaveGame</text><text x="562" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Centralizes slot + file path.</text><text x="562" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Returns optional snapshots.</text><path d="M 460 555 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="477" y="507" width="46" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="530" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">I/O</text><rect x="60" y="725" width="400" height="190" rx="24" fill="#f0eafa"/><text x="82" y="764" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Player controller</text><text x="82" y="802" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends APlayerController</text><text x="82" y="832" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Retains the returned widget.</text><text x="82" y="866" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Non-Shipping call site.</text><rect x="540" y="725" width="400" height="190" rx="24" fill="#e8eefb"/><text x="562" y="764" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Debug HUD factory</text><text x="562" y="802" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Creates UFeatureDebugHUD</text><text x="562" y="832" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Adds HUD to player screen.</text><text x="562" y="866" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Returns it to the controller.</text><path d="M 460 820 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="462" y="772" width="76" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="795" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">create</text><text x="60" y="969" font-size="26" font-weight="600" fill="#34495a" text-anchor="start">Aim: keep ownership and engine API details at narrow boundaries.</text></g></svg>

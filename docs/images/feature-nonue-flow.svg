<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc"><title id="title">Non-UE helper architecture</title><desc id="desc">The save coordinator and saved-progress preview share a plain C++ storage helper that centralizes serialization and disk access.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/><text x="60" y="64" font-size="20" font-weight="700" fill="#203e49">CRAZY BALLS / SYSTEM ARCHITECTURE</text><text x="60" y="117" font-size="44" font-weight="700" fill="#203e49">Non-UE helper architecture</text><text x="60" y="154" font-size="25" font-weight="400" fill="#34495a">Example: storage · Shared access · Snapshot values</text><rect x="60" y="220" width="400" height="260" rx="24" fill="#e7f4ef"/><text x="82" y="265" font-size="30" font-weight="700" fill="#203e49">Save coordinator</text><text x="82" y="310" font-size="21" font-weight="400" fill="#34495a">Extends UGameInstanceSubsystem</text><text x="82" y="360" font-size="26" font-weight="400" fill="#34495a">Coordinates paused I/O.</text><text x="82" y="396" font-size="26" font-weight="400" fill="#34495a">Consumes restored progress.</text><rect x="60" y="590" width="400" height="260" rx="24" fill="#f0eafa"/><text x="82" y="635" font-size="30" font-weight="700" fill="#203e49">Saved-progress preview</text><text x="82" y="680" font-size="21" font-weight="400" fill="#34495a">Extends UUserWidget</text><text x="82" y="730" font-size="26" font-weight="400" fill="#34495a">Reads without pausing play.</text><text x="82" y="766" font-size="26" font-weight="400" fill="#34495a">Leaves live state unchanged.</text><rect x="540" y="375" width="400" height="330" rx="24" fill="#e8eefb"/><text x="562" y="420" font-size="30" font-weight="700" fill="#203e49">Save storage helper</text><text x="562" y="465" font-size="21" font-weight="400" fill="#34495a">Creates UFeatureSaveGame</text><text x="562" y="515" font-size="26" font-weight="400" fill="#34495a">Slot + path + serialization.</text><text x="562" y="551" font-size="26" font-weight="400" fill="#34495a">Returns optional snapshots.</text><text x="562" y="587" font-size="26" font-weight="400" fill="#34495a">No live actor references.</text><path d="M 460 350 H 500 V 485 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="500" y="320" font-size="20" font-weight="600" text-anchor="middle" fill="#526b76">I/O</text><path d="M 460 720 H 500 V 555 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="500" y="690" font-size="20" font-weight="600" text-anchor="middle" fill="#526b76">load</text><text x="60" y="960" font-size="25" font-weight="400" fill="#34495a">Aim: keep serialization and disk access behind one focused API.</text></g></svg>

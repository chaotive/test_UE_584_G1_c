<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Game logic architecture</title><desc id="desc">Level, player and ball examples demonstrate value-based rule decisions without rebuilding C++. C++ owns configuration, state and engine effects; focused bridges own independent reusable runtimes. Scripts decide limits, outcomes, progression, speed and ball lifetime. Native enum definitions are shared. Stop PIE, edit and save the AS source, then start PIE and gameplay to load the latest rules. Live hot reload is secondary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/>
<text x="60" y="64" font-size="20" font-weight="700" fill="#627e79" text-anchor="start">CRAZY BALLS / SYSTEM ARCHITECTURE</text>
<text x="60" y="117" font-size="44" font-weight="700" fill="#203e49" text-anchor="start">Game logic architecture</text>
<text x="60" y="154" font-size="25" font-weight="400" fill="#34495a" text-anchor="start">Examples: level · player · ball rules / Value-based decisions</text><rect x="60" y="195" width="880" height="160" rx="24" fill="#e7f4ef"/><text x="82" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Native gameplay owners</text><text x="82" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Session · game state · ball · player</text><text x="82" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Inputs: level, counts, contacts, settings.</text><text x="82" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Apply decisions via Unreal APIs and events.</text><path d="M 260 355 V 445" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="222" y="387" width="76" height="30" rx="10" fill="#fbfaf6"/><text x="260" y="410" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">values</text><rect x="60" y="445" width="400" height="195" rx="24" fill="#e8eefb"/><text x="82" y="484" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">C++ rule bridges</text><text x="82" y="522" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Subsystems + actor component</text><text x="82" y="552" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Load and call .as scripts.</text><text x="82" y="586" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Own engine and context.</text><rect x="540" y="445" width="400" height="195" rx="24" fill="#f0eafa"/><text x="562" y="484" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">AngelScript rules</text><text x="562" y="522" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Level · player · ball rules</text><text x="562" y="552" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Decide gameplay behavior.</text><text x="562" y="586" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">No UObject references.</text><path d="M 460 540 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="472" y="489" width="56" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="512" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">call</text><path d="M 260 640 V 725" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="217" y="667" width="86" height="30" rx="10" fill="#fbfaf6"/><text x="260" y="690" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">SDK API</text><path d="M 740 640 V 725" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="697" y="667" width="86" height="30" rx="10" fill="#fbfaf6"/><text x="740" y="690" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">results</text><rect x="60" y="725" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="764" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">AngelScript library</text><text x="82" y="802" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Linked into TestFeatures</text><text x="82" y="832" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Pinned native interpreter.</text><text x="82" y="866" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Reused across script edits.</text><rect x="540" y="725" width="400" height="190" rx="24" fill="#fff0d9"/><text x="562" y="764" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Rule results</text><text x="562" y="802" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Values + registered enums</text><text x="562" y="832" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Limits, outcomes, next level.</text><text x="562" y="866" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Speed, bounce + retirement.</text><path d="M 940 820 H 970 V 270 H 940" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="60" y="949" font-size="26" font-weight="600" fill="#34495a" text-anchor="start">Rule edits: stop PIE → edit + save .as → start PIE.</text><text x="60" y="982" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">Reuses the C++ game binary and the running editor.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Game logic architecture</title><desc id="desc">World-scoped level and ball bridges load script functions for the new PIE world. The player bridge loads when GameMode configures its component. Native values enter the rules and returned decisions are applied by C++ to authoritative state and engine objects.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/>
<text x="60" y="64" font-size="20" font-weight="700" fill="#627e79" text-anchor="start">CRAZY BALLS / SYSTEM ARCHITECTURE</text>
<text x="60" y="117" font-size="44" font-weight="700" fill="#203e49" text-anchor="start">Game logic architecture</text>
<text x="60" y="154" font-size="25" font-weight="400" fill="#34495a" text-anchor="start">Value-based rules · Native effects · Script iteration</text><rect x="60" y="195" width="880" height="172" rx="24" fill="#e7f4ef"/><text x="82" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Native gameplay owners</text><text x="82" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Session · game state · ball · ball manager · player</text><text x="82" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Supply counts, contact facts and configured values.</text><text x="82" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Apply returned decisions with Unreal APIs.</text><rect x="60" y="445" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="484" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">C++ rule bridges</text><text x="82" y="522" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">World subsystems + actor component</text><text x="82" y="552" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Bind and call script functions.</text><text x="82" y="586" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Each owns a runtime.</text><rect x="540" y="445" width="400" height="190" rx="24" fill="#f0eafa"/><text x="562" y="484" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">AngelScript rules</text><text x="562" y="522" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Level · player · ball scripts</text><text x="562" y="552" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Limits, outcome, progression.</text><text x="562" y="586" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Speed, lifetime, replacement.</text><rect x="60" y="715" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="754" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">AngelScript library</text><text x="82" y="792" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Linked into TestFeatures</text><text x="82" y="822" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Pinned Win64 static library.</text><text x="82" y="856" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Reusable engine API.</text><rect x="540" y="715" width="400" height="190" rx="24" fill="#fff0d9"/><text x="562" y="754" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Rule results</text><text x="562" y="792" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Scalars + registered native enums</text><text x="562" y="822" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Values return via the bridge.</text><text x="562" y="856" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">C++ retains gameplay state.</text><path d="M 260 367 V 445" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="222" y="390" width="76" height="30" rx="10" fill="#fbfaf6"/><text x="260" y="413" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">values</text><path d="M 460 540 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="472" y="489" width="56" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="512" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">call</text><path d="M 260 635 V 715" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="217" y="658" width="86" height="30" rx="10" fill="#fbfaf6"/><text x="260" y="681" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">SDK API</text><path d="M 740 635 V 715" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="702" y="658" width="76" height="30" rx="10" fill="#fbfaf6"/><text x="740" y="681" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">return</text><path d="M 940 805 H 969 V 279 H 940" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="60" y="945" font-size="24" font-weight="600" fill="#34495a" text-anchor="start">Edit rules: stop PIE → save .as changes → start PIE.</text><text x="60" y="977" font-size="23" font-weight="400" fill="#34495a" text-anchor="start">Start gameplay to configure the player bridge.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Gameplay architecture</title><desc id="desc">The session controls the ball manager and arena. The manager owns the pool and announces newly created balls. The state bridge subscribes once per ball, translates contact and bounce events into score updates, and the session observes the resulting statistics.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/>
<text x="60" y="64" font-size="20" font-weight="700" fill="#627e79" text-anchor="start">CRAZY BALLS / SYSTEM ARCHITECTURE</text>
<text x="60" y="117" font-size="44" font-weight="700" fill="#203e49" text-anchor="start">Gameplay architecture</text>
<text x="60" y="154" font-size="25" font-weight="400" fill="#34495a" text-anchor="start">Object pool · Observer events · Event-to-state translation</text><rect x="60" y="195" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="82" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Gameplay session</text><text x="82" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UWorldSubsystem</text><text x="82" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Controls the ball lifecycle.</text><text x="82" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Observes session scores.</text><rect x="540" y="195" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="562" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Arena bounds</text><text x="562" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends AActor</text><text x="562" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Six collision faces</text><text x="562" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">enclose the play area.</text><rect x="60" y="460" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="82" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Ball manager</text><text x="82" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UWorldSubsystem</text><text x="82" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Configures and pools balls.</text><text x="82" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Queues retired replacements.</text><rect x="540" y="460" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="562" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Physics ball</text><text x="562" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends AStaticMeshActor</text><text x="562" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Applies physics and rules.</text><text x="562" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Emits contact and bounce.</text><rect x="60" y="730" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Game state</text><text x="82" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends AGameStateBase</text><text x="82" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Stores level and scores.</text><text x="82" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Publishes score changes.</text><rect x="540" y="730" width="400" height="190" rx="24" fill="#e8eefb"/><text x="562" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">State event bridge</text><text x="562" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UObject</text><text x="562" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Binds once per new ball.</text><text x="562" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Records scoring events.</text><path d="M 460 290 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="467" y="241" width="66" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="264" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">spawn</text><path d="M 260 385 V 460" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="107" y="408" width="306" height="30" rx="10" fill="#fbfaf6"/><text x="260" y="431" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">start / pause / resume / stop</text><path d="M 460 553 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="472" y="503" width="56" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="526" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">pool</text><path d="M 260 650 V 675 H 620 V 730" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/><rect x="371" y="652" width="86" height="30" rx="10" fill="#fbfaf6"/><text x="414" y="675" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">created</text><path d="M 795 650 V 730" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/><rect x="707" y="672" width="176" height="30" rx="10" fill="#fbfaf6"/><text x="795" y="695" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">contact / bounce</text><path d="M 540 825 H 460" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="462" y="774" width="76" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="797" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">record</text><path d="M 60 825 H 31 V 290 H 60" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="60" y="967" font-size="23" font-weight="600" fill="#34495a" text-anchor="start">Solid: calls or values. Dashed: events.</text></g></svg>

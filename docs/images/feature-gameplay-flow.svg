<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Gameplay architecture</title><desc id="desc">Gameplay architecture uses an object pool and observer events. The world subsystem owns FFeatureBallSpawner, which creates AFeatureBall actors. UFeatureGameStateController translates ball events into AFeatureGameState updates. The session observes statistics to evaluate results.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/>
<text x="60" y="64" font-size="20" font-weight="700" fill="#627e79" text-anchor="start">CRAZY BALLS / SYSTEM ARCHITECTURE</text>
<text x="60" y="117" font-size="44" font-weight="700" fill="#203e49" text-anchor="start">Gameplay architecture</text>
<text x="60" y="154" font-size="25" font-weight="400" fill="#34495a" text-anchor="start">Object pooling · Observer · Event-to-state translation</text><rect x="60" y="195" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="82" y="234" font-size="25" font-weight="700" fill="#203e49" text-anchor="start">UFeatureGameplaySession</text><text x="82" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UWorldSubsystem</text><text x="82" y="302" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">Owns the pool and state bridge.</text><text x="82" y="335" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">Evaluates win / loss from stats.</text><rect x="540" y="195" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="562" y="234" font-size="25" font-weight="700" fill="#203e49" text-anchor="start">AFeatureLevelBounds</text><text x="562" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends AActor</text><text x="562" y="302" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">Six collision components</text><text x="562" y="335" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">enclose the active arena.</text><path d="M 460 290 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="467" y="242" width="66" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="265" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">spawn</text><path d="M 260 385 V 460" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="232" y="407" width="56" height="30" rx="10" fill="#fbfaf6"/><text x="260" y="430" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">owns</text><rect x="60" y="460" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="82" y="499" font-size="25" font-weight="700" fill="#203e49" text-anchor="start">FFeatureBallSpawner</text><text x="82" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Creates AFeatureBall</text><text x="82" y="567" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">For UFeatureGameplaySession</text><text x="82" y="597" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">Reuses inactive ball actors.</text><rect x="540" y="460" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="562" y="499" font-size="25" font-weight="700" fill="#203e49" text-anchor="start">AFeatureBall</text><text x="562" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends AStaticMeshActor</text><text x="562" y="567" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">Caches its physics component.</text><text x="562" y="600" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">Emits bounce / contact events.</text><path d="M 460 553 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="467" y="502" width="66" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="525" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">reuse</text><path d="M 740 650 V 730" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="702" y="673" width="76" height="30" rx="10" fill="#fbfaf6"/><text x="740" y="696" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">events</text><rect x="540" y="730" width="400" height="190" rx="24" fill="#e8eefb"/><text x="562" y="769" font-size="22" font-weight="700" fill="#203e49" text-anchor="start">UFeatureGameStateController</text><text x="562" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UObject</text><text x="562" y="837" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">Translates ball notifications</text><text x="562" y="870" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">into game-state updates.</text><rect x="60" y="730" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="769" font-size="25" font-weight="700" fill="#203e49" text-anchor="start">AFeatureGameState</text><text x="82" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends AGameStateBase</text><text x="82" y="837" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">Stores counts, level and history.</text><text x="82" y="870" font-size="24" font-weight="400" fill="#34495a" text-anchor="start">Publishes changes to observers.</text><path d="M 540 825 H 460" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="462" y="777" width="76" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="800" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">record</text><path d="M 60 825 H 30 V 290 H 60" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="60" y="963" font-size="25" font-weight="600" fill="#34495a" text-anchor="start">Retirement → session → pooled replacement on the next tick.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">UI architecture</title><desc id="desc">UI architecture uses declarative menu data, UUserWidget composition and observer bindings. FFeatureMenuViews builds values for UFeatureMainMenu. The player controller manages HUD lifetime; each widget owns synchronization, event subscriptions and unsubscription.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/>
<text x="60" y="64" font-size="20" font-weight="700" fill="#627e79" text-anchor="start">CRAZY BALLS / SYSTEM ARCHITECTURE</text>
<text x="60" y="117" font-size="44" font-weight="700" fill="#203e49" text-anchor="start">UI architecture</text>
<text x="60" y="154" font-size="25" font-weight="400" fill="#34495a" text-anchor="start">Declarative views · Widget composition · Observer bindings</text><rect x="60" y="195" width="400" height="190" rx="24" fill="#f0eafa"/><text x="82" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Menu definitions</text><text x="82" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Values for UFeatureMainMenu</text><text x="82" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Initial · Pause</text><text x="82" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Victory · Defeat</text><rect x="540" y="195" width="400" height="190" rx="24" fill="#f0eafa"/><text x="562" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Shared menu</text><text x="562" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UUserWidget</text><text x="562" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Shared layout and input.</text><text x="562" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Actions → game mode.</text><path d="M 460 290 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="472" y="242" width="56" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="265" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">data</text><rect x="60" y="460" width="400" height="190" rx="24" fill="#f0eafa"/><text x="82" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Gameplay HUD</text><text x="82" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UUserWidget</text><text x="82" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Level, counts and targets.</text><text x="82" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Observes state + session.</text><rect x="540" y="460" width="400" height="190" rx="24" fill="#f0eafa"/><text x="562" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Debug HUD</text><text x="562" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UUserWidget</text><text x="562" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Contains ball + save panels.</text><text x="562" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Non-Shipping builds only.</text><path d="M 740 650 V 730" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M 740 685 H 260 V 730" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="402" y="672" width="196" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="695" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">owns child widgets</text><rect x="60" y="730" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="82" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Ball panel</text><text x="82" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UUserWidget</text><text x="82" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Bounce total and level.</text><text x="82" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Observes game state.</text><rect x="540" y="730" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="562" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Save panel</text><text x="562" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UUserWidget</text><text x="562" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Save controls + diagnostics.</text><text x="562" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Observes I/O status.</text><text x="60" y="959" font-size="24" font-weight="600" fill="#34495a" text-anchor="start">Widgets own initial sync, subscriptions and unsubscription.</text></g></svg>

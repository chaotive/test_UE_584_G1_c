<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">UI architecture</title><desc id="desc">Menu definitions supply one shared widget. The widget publishes selected actions to the menu controller and composes a saved-progress preview. The player controller owns HUD lifetime, while HUD widgets bind their own data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/>
<text x="60" y="64" font-size="20" font-weight="700" fill="#627e79" text-anchor="start">CRAZY BALLS / SYSTEM ARCHITECTURE</text>
<text x="60" y="117" font-size="44" font-weight="700" fill="#203e49" text-anchor="start">UI architecture</text>
<text x="60" y="154" font-size="25" font-weight="400" fill="#34495a" text-anchor="start">Declarative views · Action routing · Widget composition</text><rect x="60" y="195" width="400" height="190" rx="24" fill="#f0eafa"/><text x="82" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Menu definitions</text><text x="82" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Values for UFeatureMainMenu</text><text x="82" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Four ordered menu views.</text><text x="82" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Actions grouped by purpose.</text><rect x="540" y="195" width="400" height="190" rx="24" fill="#f0eafa"/><text x="562" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Shared menu</text><text x="562" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UUserWidget</text><text x="562" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Builds layout and input.</text><text x="562" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Publishes selected actions.</text><rect x="60" y="460" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Menu controller</text><text x="82" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UWorldSubsystem</text><text x="82" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Owns the active menu.</text><text x="82" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Routes actions to services.</text><rect x="540" y="460" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="562" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Saved-progress preview</text><text x="562" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UUserWidget</text><text x="562" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Reads saved level and stats.</text><text x="562" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Reports slot availability.</text><rect x="60" y="730" width="400" height="190" rx="24" fill="#f0eafa"/><text x="82" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Player controller</text><text x="82" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends APlayerController</text><text x="82" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Creates local HUD widgets.</text><text x="82" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Retains and removes them.</text><rect x="540" y="730" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="562" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">HUD widgets</text><text x="562" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extend UUserWidget</text><text x="562" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Gameplay: level and targets.</text><text x="562" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Debug: ball and save panels.</text><path d="M 460 290 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="472" y="241" width="56" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="264" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">view</text><path d="M 605 385 V 414 H 260 V 460" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/><rect x="397" y="391" width="86" height="30" rx="10" fill="#fbfaf6"/><text x="440" y="414" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">actions</text><path d="M 750 385 V 460" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="702" y="409" width="96" height="30" rx="10" fill="#fbfaf6"/><text x="750" y="432" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">composes</text><path d="M 460 825 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="462" y="776" width="76" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="799" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">create</text><path d="M 890 460 V 385" fill="none" stroke="#67808b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><rect x="846" y="407" width="88" height="30" rx="10" fill="#fbfaf6"/><text x="890" y="430" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">preview</text><text x="60" y="967" font-size="23" font-weight="600" fill="#34495a" text-anchor="start">Widgets own their data subscriptions. Debug HUD is non-Shipping.</text></g></svg>

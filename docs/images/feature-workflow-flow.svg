<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Session architecture</title><desc id="desc">A round demonstrates an explicit lifecycle state machine and separate world and game-instance responsibilities. The session records results in game state. The save coordinator pauses I/O, delegates serialization and publishes completion. Value snapshots contain durable progress; helper APIs are detailed separately.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/>
<text x="60" y="64" font-size="20" font-weight="700" fill="#627e79" text-anchor="start">CRAZY BALLS / SYSTEM ARCHITECTURE</text>
<text x="60" y="117" font-size="44" font-weight="700" fill="#203e49" text-anchor="start">Session architecture</text>
<text x="60" y="154" font-size="25" font-weight="400" fill="#34495a" text-anchor="start">Example: a round · State machine · Progress snapshots</text><rect x="60" y="195" width="400" height="190" rx="24" fill="#f0eafa"/><text x="82" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Game mode</text><text x="82" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends AGameModeBase</text><text x="82" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Routes menu actions.</text><text x="82" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Presents lifecycle screens.</text><rect x="540" y="195" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="562" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Gameplay session</text><text x="562" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UWorldSubsystem</text><text x="562" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Start · Pause · Resume · End</text><text x="562" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Owns round lifecycle state.</text><path d="M 460 290 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="467" y="242" width="66" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="265" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">calls</text><path d="M 740 385 V 460" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="602" y="407" width="276" height="30" rx="10" fill="#fbfaf6"/><text x="740" y="430" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">initialize / record result</text><rect x="540" y="460" width="400" height="190" rx="24" fill="#e8eefb"/><text x="562" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Game state</text><text x="562" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends AGameStateBase</text><text x="562" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Owns progress values.</text><text x="562" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Requests save / load.</text><rect x="60" y="460" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Save coordinator</text><text x="82" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UGameInstanceSubsystem</text><text x="82" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Pauses play during I/O.</text><text x="82" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Publishes load + status events.</text><path d="M 540 553 H 460" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="477" y="502" width="46" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="525" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">I/O</text><path d="M 260 650 V 730" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="187" y="672" width="146" height="30" rx="10" fill="#fbfaf6"/><text x="260" y="695" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">delegates I/O</text><rect x="60" y="730" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Save storage</text><text x="82" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Creates UFeatureSaveGame</text><text x="82" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Serializes copied progress.</text><text x="82" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Completes asynchronously.</text><rect x="540" y="730" width="400" height="190" rx="24" fill="#e8eefb"/><text x="562" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Save snapshot</text><text x="562" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends USaveGame</text><text x="562" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Level, total bounce count</text><text x="562" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">and session history.</text><path d="M 460 825 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="462" y="777" width="76" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="800" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">values</text><text x="60" y="982" font-size="23" font-weight="600" fill="#34495a" text-anchor="start">Aim: explicit transitions + separate round and I/O lifetimes.</text></g></svg>

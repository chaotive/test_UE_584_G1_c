<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Session architecture</title><desc id="desc">GameMode supplies settings to the world session. The progress component on game state forwards persistence requests to the game-instance coordinator and binds its loaded snapshot event directly to game state. Storage performs I/O, and the coordinator restores the prior pause state.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67808b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="1000" rx="32" fill="#fbfaf6"/>
<text x="60" y="64" font-size="20" font-weight="700" fill="#627e79" text-anchor="start">CRAZY BALLS / SYSTEM ARCHITECTURE</text>
<text x="60" y="117" font-size="44" font-weight="700" fill="#203e49" text-anchor="start">Session architecture</text>
<text x="60" y="154" font-size="25" font-weight="400" fill="#34495a" text-anchor="start">Lifecycle state machine · Snapshot binding · Async I/O</text><rect x="60" y="195" width="400" height="190" rx="24" fill="#f0eafa"/><text x="82" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Game mode</text><text x="82" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends AGameModeBase</text><text x="82" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Supplies arena settings.</text><text x="82" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Observes lifecycle events.</text><rect x="540" y="195" width="400" height="190" rx="24" fill="#e7f4ef"/><text x="562" y="234" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Gameplay session</text><text x="562" y="272" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UWorldSubsystem</text><text x="562" y="302" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Ready → Playing ↔ Paused</text><text x="562" y="336" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Playing → Ended</text><rect x="60" y="460" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Save coordinator</text><text x="82" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UGameInstanceSubsystem</text><text x="82" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Gates play during I/O.</text><text x="82" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Restores the prior pause.</text><rect x="540" y="460" width="400" height="190" rx="24" fill="#e8eefb"/><text x="562" y="499" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Progress binding</text><text x="562" y="537" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends UActorComponent</text><text x="562" y="567" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Binds load to game state.</text><text x="562" y="601" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Cancels on world teardown.</text><rect x="60" y="730" width="400" height="190" rx="24" fill="#e8eefb"/><text x="82" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Save storage</text><text x="82" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Creates UFeatureSaveGame</text><text x="82" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Loads and saves snapshots.</text><text x="82" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Supports teardown save.</text><rect x="540" y="730" width="400" height="190" rx="24" fill="#e8eefb"/><text x="562" y="769" font-size="30" font-weight="700" fill="#203e49" text-anchor="start">Game state</text><text x="562" y="807" font-size="21" font-weight="600" fill="#48616c" text-anchor="start">Extends AGameStateBase</text><text x="562" y="837" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Owns progress and history.</text><text x="562" y="871" font-size="26" font-weight="400" fill="#34495a" text-anchor="start">Initializes restored values.</text><path d="M 460 289 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="467" y="240" width="66" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="263" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">start</text><path d="M 740 385 V 460" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="672" y="409" width="136" height="30" rx="10" fill="#fbfaf6"/><text x="740" y="432" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">start / save</text><path d="M 540 548 H 460" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="477" y="499" width="46" height="30" rx="10" fill="#fbfaf6"/><text x="500" y="522" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">I/O</text><path d="M 260 650 V 730" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="197" y="672" width="126" height="30" rx="10" fill="#fbfaf6"/><text x="260" y="695" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">storage API</text><path d="M 740 650 V 730" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="662" y="672" width="156" height="30" rx="10" fill="#fbfaf6"/><text x="740" y="695" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">reads progress</text><path d="M 460 602 H 504 V 813 H 540" fill="none" stroke="#67808b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/><rect x="466" y="739" width="76" height="30" rx="10" fill="#fbfaf6"/><text x="504" y="762" font-size="20" font-weight="600" fill="#526b76" text-anchor="middle">loaded</text><text x="60" y="967" font-size="23" font-weight="600" fill="#34495a" text-anchor="start">The binding connects restore before the session starts.</text></g></svg>
